name: Deploy

permissions:
  contents: write

on:
  push:
    tags:
      - "**"

jobs:
  compile-and-upload:
    name: Compile and Upload Plugin
    runs-on: ${{ matrix.architecture }}
    strategy:
      matrix:
        target:
          - distro: ubuntu
            version: "25.04"
          - distro: ubuntu
            version: "25.10"
          - distro: ubuntu
            version: "26.04"
          - distro: fedora
            version: "40"
          - distro: fedora
            version: "41"
          - distro: fedora
            version: "42"
          - distro: fedora
            version: "43"
          - distro: fedora
            version: "44"
        architecture: [ubuntu-latest, ubuntu-latest-arm]
    container:
      image: ghcr.io/kando-menu/kwin-dev-containers-${{ matrix.target.distro }}-${{ matrix.target.version }}:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - name: Create Release
        run: |
          cmake -S . -B build
          cmake --build build --config Release
      - name: Determine KWin Version
        id: kwin_version
        shell: bash
        run: |
          VERSION="unknown"
          CANDIDATE=""

          # Ubuntu / Debian containers
          if command -v dpkg-query >/dev/null 2>&1; then
            for PACKAGE in kwin-x11 kwin-dev; do
              if CANDIDATE="$(dpkg-query -W -f='${Version}' "$PACKAGE" 2>/dev/null)"; then
                VERSION="$CANDIDATE"
                break
              fi
            done
          fi

          # Fedora / RPM containers
          if [[ "$VERSION" == "unknown" ]] && command -v rpm >/dev/null 2>&1; then
            for PACKAGE in kwin kwin-devel kwin-libs; do
              if CANDIDATE="$(rpm -q --qf '%{VERSION}' "$PACKAGE" 2>/dev/null)"; then
                VERSION="$CANDIDATE"
                break
              fi
            done
          fi

          VERSION="${VERSION%%-*}"
          VERSION="${VERSION#*:}"
          VERSION="${VERSION//[^0-9A-Za-z._-]/_}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Package Release Asset
        id: package_asset
        shell: bash
        run: |
          if [[ "${{ matrix.architecture }}" == "ubuntu-latest-arm" ]]; then
            ARCH_SUFFIX="arm"
          else
            ARCH_SUFFIX="x86"
          fi
          ASSET_NAME="kandointegration-${{ matrix.target.distro }}-${{ matrix.target.version }}-kwin-${{ steps.kwin_version.outputs.version }}-${ARCH_SUFFIX}.zip"
          mkdir -p build/release-asset
          cp build/bin/kwin/effects/plugins/kandointegration.so build/release-asset/kandointegration.so
          (
            cd build/release-asset
            cmake -E tar cf "../${ASSET_NAME}" --format=zip kandointegration.so
          )
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
      - name: Upload Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de #v2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/${{ steps.package_asset.outputs.asset_name }}
          asset_name: ${{ steps.package_asset.outputs.asset_name }}
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: true
